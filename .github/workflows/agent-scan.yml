name: Sec-LLM Agent Security Scan

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

jobs:
  agent-scan:
    name: Agent Security Assessment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install agent dependencies
        run: |
          cd backend
          pip install langgraph langgraph-checkpoint httpx pydantic-settings

      - name: Run agent scan (non-interactive)
        id: scan
        run: |
          cd backend
          python -c "
          import asyncio
          from agents.supervisor import run_multi_agent

          async def main():
              result = await run_multi_agent(
                  target='${{ github.event.pull_request.head.sha || github.sha }}',
                  task_type='code_audit',
                  provider='local',
              )
              findings = result.get('findings', [])
              critical = [f for f in findings if f.get('severity') in ('High', 'Critical')]
              print(f'Findings: {len(findings)} total, {len(critical)} critical')
              if critical:
                  print('CRITICAL_FINDINGS=true')
                  for f in critical:
                      print(f'  [{f[\"severity\"]}] {f[\"title\"]}')
              else:
                  print('CRITICAL_FINDINGS=false')
          asyncio.run(main())
          "
        continue-on-error: true

      - name: Post findings as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const findings = `## Sec-LLM Agent Scan Results

            **Target**: ${{ github.event.pull_request.head.sha }}
            **Status**: ${{ steps.scan.outcome }}

            See full scan results in the CI logs above.

            > Powered by Sec-LLM AI Agent Platform`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: findings
            });
