# Minimal Prometheus scrape config for the Sec-LLM API.
# When Prometheus runs outside the compose network, point the target at the
# published port (host.docker.internal:8000 on Docker Desktop).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: sec-llm-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
